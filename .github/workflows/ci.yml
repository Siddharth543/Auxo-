name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    name: AuxoKit tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Run unit tests
        run: swift test --package-path Packages/AuxoKit

  build:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Auxo-macOS
            destination: generic/platform=macOS
          - scheme: Auxo-iOS
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Auxo.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee xcodebuild.log
      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler errors as annotations so they show up on the PR / run summary.
          grep -E "error:" xcodebuild.log | sed -E "s#^$PWD/##" | sort -u | head -60 > errors.txt || true
          if [ -s errors.txt ]; then
            body=$(sed ':a;N;$!ba;s/\n/%0A/g' errors.txt)
            echo "::error title=xcodebuild errors::${body}"
          else
            tail -80 xcodebuild.log
          fi
