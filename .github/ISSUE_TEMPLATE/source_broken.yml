name: Source broke
description: A site's heatmap shows "Unavailable" or wrong data.
labels: [source-broken]
body:
  - type: dropdown
    id: source
    attributes:
      label: Which source?
      options:
        - LeetCode
        - Codeforces
        - GitHub
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error shown in the app
      description: Copy the orange message from the account's card on the dashboard.
    validations:
      required: true
  - type: input
    id: since
    attributes:
      label: Since when?
      placeholder: Worked until 2026-11-02
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: If you compared requests in your browser's Network tab, paste what changed. Never paste tokens or cookies.
